name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check_secrets.py --history

  hosted-audio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r frontend/audio_backend/requirements.txt pytest==8.3.3 httpx==0.28.1 pip-audit==2.10.1
      - run: python -m pytest frontend/audio_backend/tests -q
      - run: pip-audit -r frontend/audio_backend/requirements.txt
      - name: Check training transform stays in sync
        run: cmp ml/src/preprocessing/audio.py frontend/audio_backend/preprocessing.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest==8.3.3

      - name: Run Pytest
        run: |
          cd backend
          python -m pytest -v

      - name: Validate Catalog
        run: |
          python backend/scripts/seed.py --validate-only

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Check vulnerabilities
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Test audio and security policy
        run: |
          cd frontend
          node --test tests/*.test.mjs

      - name: Build Next.js
        run: |
          cd frontend
          npm run build
