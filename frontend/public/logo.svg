<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" class="chordly-guitar-logo">
  <g transform="rotate(42 50 50)">
    <!-- Tuning Pegs (3 left, 3 right) -->
    <!-- Left pegs -->
    <path d="M42 9.5 L39.5 9.5 C38.5 9.5 38 10 38 10.8 C38 11.6 38.5 12.1 39.5 12.1 L42 12.1 Z" fill="#f59e0b" />
    <path d="M42 13.5 L39.5 13.5 C38.5 13.5 38 14 38 14.8 C38 15.6 38.5 16.1 39.5 16.1 L42 16.1 Z" fill="#f59e0b" />
    <path d="M42 17.5 L39.5 17.5 C38.5 17.5 38 18 38 18.8 C38 19.6 38.5 20.1 39.5 20.1 L42 20.1 Z" fill="#f59e0b" />

    <!-- Right pegs -->
    <path d="M58 9.5 L60.5 9.5 C61.5 9.5 62 10 62 10.8 C62 11.6 61.5 12.1 60.5 12.1 L58 12.1 Z" fill="#f59e0b" />
    <path d="M58 13.5 L60.5 13.5 C61.5 13.5 62 14 62 14.8 C62 15.6 61.5 16.1 60.5 16.1 L58 16.1 Z" fill="#f59e0b" />
    <path d="M58 17.5 L60.5 17.5 C61.5 17.5 62 18 62 18.8 C62 19.6 61.5 20.1 60.5 20.1 L58 20.1 Z" fill="#f59e0b" />

    <!-- Headstock Body -->
    <path d="M43.2 21 L42.2 8.5 C42.2 7 45.5 5.8 50 6.6 C54.5 5.8 57.8 7 57.8 8.5 L56.8 21 Z" fill="#f59e0b" />
    <!-- Slotted headstock inner cutouts -->
    <rect x="44.2" y="8" width="2" height="11" rx="1" fill="#09090b" />
    <rect x="53.8" y="8" width="2" height="11" rx="1" fill="#09090b" />

    <!-- Nut -->
    <rect x="46.5" y="20.8" width="7" height="1.2" rx="0.3" fill="#ffffff" />

    <!-- Slender Neck (Nut to 14th fret at body joint y=48) -->
    <path d="M46.8 22 L46.2 48.5 L53.8 48.5 L53.2 22 Z" fill="#f59e0b" />

    <!-- Frets along neck -->
    <line x1="46.7" y1="24.2" x2="53.3" y2="24.2" stroke="#ffffff" stroke-width="0.5" />
    <line x1="46.7" y1="26.6" x2="53.3" y2="26.6" stroke="#ffffff" stroke-width="0.5" />
    <line x1="46.6" y1="29.2" x2="53.4" y2="29.2" stroke="#ffffff" stroke-width="0.5" />
    <line x1="46.5" y1="32.0" x2="53.5" y2="32.0" stroke="#ffffff" stroke-width="0.5" />
    <line x1="46.5" y1="35.0" x2="53.5" y2="35.0" stroke="#ffffff" stroke-width="0.5" />
    <line x1="46.4" y1="38.2" x2="53.6" y2="38.2" stroke="#ffffff" stroke-width="0.5" />
    <line x1="46.3" y1="41.5" x2="53.7" y2="41.5" stroke="#ffffff" stroke-width="0.5" />
    <line x1="46.2" y1="45.0" x2="53.8" y2="45.0" stroke="#ffffff" stroke-width="0.5" />

    <!-- Dreadnought Acoustic Body -->
    <path d="M46.2 48 
             C41.5 48 33.5 50.5 33.5 60
             C33.5 65.5 36.8 68.5 38.5 70.5
             C35.5 73.5 30 78.5 30 85.5
             C30 94.5 40 96.5 50 96.5
             C60 96.5 70 94.5 70 85.5
             C70 78.5 64.5 73.5 61.5 70.5
             C63.2 68.5 66.5 65.5 66.5 60
             C66.5 50.5 58.5 48 53.8 48 Z" 
          fill="#f59e0b" />

    <!-- Rosette / Soundhole -->
    <!-- Outer white border -->
    <circle cx="50" cy="62" r="7.5" stroke="#ffffff" stroke-width="0.9" fill="none" />
    <circle cx="50" cy="62" r="6.2" stroke="#ffffff" stroke-width="0.4" fill="none" />
    <!-- Dark soundhole center -->
    <circle cx="50" cy="62" r="5.4" fill="#09090b" />

    <!-- Teardrop Pickguard (matches reference white shape) -->
    <path d="M52 62 
             C56 62 58.5 64.5 58.5 68
             C58.5 72 54.5 75 52 75.5
             C52.6 71.5 52.5 66 52 62 Z" 
          fill="#ffffff" />

    <!-- Acoustic Bridge -->
    <!-- Belly bridge base -->
    <path d="M42 80
             C44.5 81 47 81.3 50 81.3
             C53 81.3 55.5 81 58 80
             C59 80.8 58.5 83.2 57 83.5
             C54.5 84 45.5 84 43 83.5
             C41.5 83.2 41 80.8 42 80 Z" 
          fill="#ffffff" />
    <!-- Dark saddle -->
    <line x1="44.2" y1="81.2" x2="55.8" y2="81.2" stroke="#09090b" stroke-width="0.7" />
    <!-- 6 Bridge pins -->
    <circle cx="44.8" cy="82.4" r="0.35" fill="#09090b" />
    <circle cx="46.9" cy="82.4" r="0.35" fill="#09090b" />
    <circle cx="49.0" cy="82.4" r="0.35" fill="#09090b" />
    <circle cx="51.0" cy="82.4" r="0.35" fill="#09090b" />
    <circle cx="53.1" cy="82.4" r="0.35" fill="#09090b" />
    <circle cx="55.2" cy="82.4" r="0.35" fill="#09090b" />

    <!-- 6 Strings running from nut to bridge -->
    <line x1="47.2" y1="21" x2="44.8" y2="81.2" stroke="#ffffff" stroke-width="0.38" opacity="0.95" />
    <line x1="48.3" y1="21" x2="46.9" y2="81.2" stroke="#ffffff" stroke-width="0.35" opacity="0.95" />
    <line x1="49.4" y1="21" x2="49.0" y2="81.2" stroke="#ffffff" stroke-width="0.32" opacity="0.95" />
    <line x1="50.6" y1="21" x2="51.0" y2="81.2" stroke="#ffffff" stroke-width="0.32" opacity="0.95" />
    <line x1="51.7" y1="21" x2="53.1" y2="81.2" stroke="#ffffff" stroke-width="0.30" opacity="0.95" />
    <line x1="52.8" y1="21" x2="55.2" y2="81.2" stroke="#ffffff" stroke-width="0.28" opacity="0.95" />
  </g>
</svg>