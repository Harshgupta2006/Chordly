[project]
name = "chordly-backend"
version = "0.1.0"
description = "Backend for Chordly, a guitar chord-based song discovery engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "pydantic==2.10.6",
    "sqlmodel==0.0.22",
    "alembic==1.14.1",
    "psycopg2-binary==2.9.10",
    "slowapi==0.1.9",
    "httpx==0.28.1",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
